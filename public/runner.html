<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>七宗罪 VS 七美德 · 互动叙事测试</title>
<style>
  :root { --bg:#0c0a0f; --ink:#e9e2d0; --dim:#7a7264; --l:#3a6ea5; --r:#a5403a; --gold:#c9a227; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Noto Serif SC",Georgia,"Songti SC",serif; -webkit-text-size-adjust:100%; }
  #app { max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom)); }
  .top { display:flex; justify-content:space-between; align-items:center; color:var(--dim); font-size:13px; letter-spacing:2px; }
  .scene { flex:1; display:flex; flex-direction:column; justify-content:center; gap:18px; }
  .ch { color:var(--gold); font-size:13px; letter-spacing:3px; }
  .atm { font-size:19px; line-height:1.7; min-height:3.2em; }
  .consequence { color:var(--dim); font-size:15px; line-height:1.7; min-height:2em; opacity:0; transition:opacity .4s; }
  .consequence.show { opacity:1; }
  .ring { font-size:12px; color:var(--r); letter-spacing:1px; }
  .choices { display:flex; gap:12px; margin-top:8px; }
  .opt { flex:1; border:1px solid #2a2520; background:#15110d; color:var(--ink); padding:16px 12px;
    border-radius:10px; font-size:15px; text-align:left; cursor:pointer; transition:transform .12s, border-color .2s; }
  .opt:hover { transform:translateY(-2px); }
  .opt.l:hover { border-color:var(--l); } .opt.r:hover { border-color:var(--r); }
  .opt small { display:block; color:var(--dim); font-size:12px; margin-top:6px; }
  .axes { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
  .axes span { font-size:11px; color:var(--dim); border:1px solid #241f1a; padding:2px 6px; border-radius:6px; }
  .panel { font-size:11px; color:var(--dim); border:1px solid #241f1a; border-radius:8px;
    padding:8px 10px; margin-top:10px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; letter-spacing:1px; }
  .panel b { color:var(--ink); font-weight:600; }
  .badges { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  .badges span { font-size:11px; color:var(--gold); border:1px solid #4a3d18; padding:3px 8px; border-radius:6px; }
  .ending { text-align:center; padding:30px 10px; }
  .ending h1 { color:var(--gold); font-size:30px; letter-spacing:4px; margin:6px 0; }
  .ending .tag { color:var(--dim); font-size:13px; letter-spacing:2px; }
  .ending p { font-size:16px; line-height:1.8; }
  button.act { background:var(--gold); color:#1a140a; border:0; padding:12px 22px; border-radius:8px;
    font-size:15px; cursor:pointer; margin-top:10px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="app">
  <div class="top"><span>七宗罪 VS 七美德</span><span id="progress"></span></div>
  <div id="stage" class="scene">
    <div class="ch" id="chapter"></div>
    <div class="atm" id="atmosphere"></div>
    <div class="ring hidden" id="ring"></div>
    <div class="consequence" id="consequence"></div>
    <div class="choices hidden" id="choices">
      <button class="opt l" id="optL"></button>
      <button class="opt r" id="optR"></button>
    </div>
  </div>
  <div id="ending" class="ending hidden"></div>
  <div class="panel" id="panel"></div>
</div>
<script>
const $ = (id) => document.getElementById(id)
let cards = [], idx = 0, timer = null

async function boot() {
  await fetch('/api/reset', { method: 'POST' })
  cards = (await (await fetch('/api/cards')).json()).cards
  await renderPanel()
  showCard()
}
function showCard() {
  const c = cards[idx]
  $('chapter').textContent = c.chapter
  $('atmosphere').textContent = c.scene
  $('progress').textContent = `${idx + 1} / ${cards.length}`
  $('consequence').classList.remove('show'); $('consequence').textContent = ''
  $('choices').classList.remove('hidden')
  $('optL').innerHTML = `${c.L}<small>向左滑 / 点击左</small>`
  $('optR').innerHTML = `${c.R}<small>向右滑 / 点击右</small>`
  if (c.isQte) {
    let left = Math.ceil(c.qteMs / 1000)
    const ring = $('ring'); ring.classList.remove('hidden'); ring.textContent = `限时 ${left}s`
    timer = setInterval(() => { left--; if (left <= 0) { clearInterval(timer); choose('R', true) } else ring.textContent = `限时 ${left}s` }, 1000)
  } else $('ring').classList.add('hidden')
}
async function renderPanel() {
  const st = (await (await fetch('/api/state')).json()).state
  const c = st.counters
  $('panel').innerHTML =
    `<span>冷酷 <b>${c.COLD}</b></span><span>牺牲 <b>${c.SACR}</b></span>` +
    `<span>混乱 <b>${c.CHAOS}</b></span><span>傲慢 <b>${c.PRIDE}</b></span>` +
    `<span>存活 <b>${st.blood}</b></span><span>秘密 <b>${st.secrets}</b></span>` +
    `<span>背叛 <b>${st.betrayed}</b></span>`
}
async function choose(side, timeout = false) {
  if (timer) { clearInterval(timer); timer = null }
  const c = cards[idx]
  await fetch('/api/choose', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cardId: c.id, side }) })
  const cons = side === 'L' ? c.L : c.R
  $('consequence').textContent = (timeout ? '（超时，默认记右）' : '') + '— ' + cons
  $('consequence').classList.add('show')
  $('choices').classList.add('hidden')
  setTimeout(async () => {
    idx++
    if (idx >= cards.length) return showEnding()
    await renderPanel()
    showCard()
  }, 1700)
}
async function showEnding() {
  const e = (await (await fetch('/api/judge', { method: 'POST' })).json()).ending
  $('stage').classList.add('hidden')
  const box = $('ending'); box.classList.remove('hidden')
  const badges = (e.badges || []).map(b => `<span>${b}</span>`).join('')
  box.innerHTML = `<div class="tag">${e.layer} · 结局</div><h1>${e.name}</h1><p>${e.text}</p>
    <div class="panel">${e.topCounters.map(a => `<span>${a}</span>`).join('')}</div>
    ${badges ? `<div class="badges">${badges}</div>` : ''}
    <button class="act" onclick="location.reload()">再来一局</button>`
}
$('optL').onclick = () => choose('L')
$('optR').onclick = () => choose('R')
document.addEventListener('keydown', (ev) => {
  if ($('choices').classList.contains('hidden')) return
  if (ev.key === 'ArrowLeft') choose('L')
  if (ev.key === 'ArrowRight') choose('R')
})
boot()
</script>
</body>
</html>
